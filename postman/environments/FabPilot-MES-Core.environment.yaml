$kind: environment
name: FabPilot MES Core | Local Development
description: Local MES Core environment using Spring Boot 8080 and MySQL 3307.
values:
  # 01 - Application connection
  - key: app_base_url
    value: 'http://localhost:8080'
    enabled: true
    type: default

  # 02 - Lot diagnostic scenarios
  - key: lot_query_held_code
    value: LOT-013
    enabled: true
    type: default
  - key: lot_query_ready_code
    value: LOT-014
    enabled: true
    type: default
  - key: lot_query_not_found_code
    value: LOT-NONEXISTENT
    enabled: true
    type: default

  # 03 - Lot Release command scenario
  - key: lot_release_code
    value: LOT-015
    enabled: true
    type: default
  - key: lot_release_expected_version
    value: '0'
    enabled: true
    type: default
  - key: lot_release_idempotency_key
    value: POSTMAN-LOT-015-RELEASE-001
    enabled: true
    type: default

  # 04 - Lot Track In command scenario
  - key: lot_track_in_code
    value: LOT-016
    enabled: true
    type: default
  - key: lot_track_in_expected_version
    value: '0'
    enabled: true
    type: default
  - key: lot_track_in_idempotency_key
    value: VERIFY-LOT-016-TRACK-IN-001
    enabled: true
    type: default
  - key: lot_track_in_equipment_code
    value: ETCH-02
    enabled: true
    type: default

  # 05 - Lot Track Out command scenario
  - key: lot_track_out_code
    value: LOT-016
    enabled: true
    type: default
  - key: lot_track_out_expected_version
    value: '1'
    enabled: true
    type: default
  - key: lot_track_out_idempotency_key
    value: POSTMAN-LOT-016-TRACK-OUT-001
    enabled: true
    type: default

  # 06 - Lot Hold command scenario
  - key: lot_hold_code
    value: LOT-016
    enabled: true
    type: default
  - key: lot_hold_expected_version
    value: '2'
    enabled: true
    type: default
  - key: lot_hold_idempotency_key
    value: POSTMAN-LOT-016-HOLD-001
    enabled: true
    type: default
  - key: lot_hold_reason_code
    value: QUALITY_CHECK
    enabled: true
    type: default
  - key: lot_hold_reason_text
    value: 检测工序前需要复核质量数据
    enabled: true
    type: default

  # 07 - Lot Release Hold command scenario
  - key: lot_release_hold_code
    value: LOT-016
    enabled: true
    type: default
  - key: lot_release_hold_expected_version
    value: '3'
    enabled: true
    type: default
  - key: lot_release_hold_idempotency_key
    value: POSTMAN-LOT-016-RELEASE-HOLD-001
    enabled: true
    type: default
  - key: lot_release_hold_reason_code
    value: QUALITY_CHECK_RESOLVED
    enabled: true
    type: default
  - key: lot_release_hold_reason_text
    value: 质量数据复核完成，允许继续检测
    enabled: true
    type: default

  # 08 - Lot Scrap command scenario
  - key: lot_scrap_code
    value: LOT-016
    enabled: true
    type: default
  - key: lot_scrap_expected_version
    value: '4'
    enabled: true
    type: default
  - key: lot_scrap_idempotency_key
    value: POSTMAN-LOT-016-SCRAP-001
    enabled: true
    type: default
  - key: lot_scrap_reason_code
    value: INSPECTION_REJECT
    enabled: true
    type: default
  - key: lot_scrap_reason_text
    value: 检测结果超出规格，确认报废
    enabled: true
    type: default

  # 09 - Shared test identity and tracing
  - key: test_operator_id
    value: POSTMAN-USER
    enabled: true
    type: default
  - key: test_trace_prefix
    value: POSTMAN-FABPILOT
    enabled: true
    type: default