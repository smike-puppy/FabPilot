$kind: http-request
name: 03 Complete Maintenance
method: POST
url: 'http://localhost:8080/api/equipment-events'
description: '专用设备状态切换测试。发送前按 docs/EQUIPMENT_EVENT_MANUAL_TEST.md 查询数据库前置状态；本请求不会由 Codex 自动执行。'
order: 11000
headers:
  Content-Type: application/json
  X-Trace-Id: 'POSTMAN-FABPILOT-EQP-STATE-11000'
body:
  type: json
  content: |-
    {
      "equipmentCode": "EQP-STATE-TEST-01",
      "eventCode": "COMPLETE_MAINTENANCE",
      "expectedVersion": 1,
      "idempotencyKey": "POSTMAN-EQP-STATE-COMPLETE-20260808-01",
      "operatorId": "POSTMAN-USER",
      "operatorType": "USER",
      "reasonCode": "MAINTENANCE_COMPLETED",
      "reasonText": "专用测试设备维护完成并恢复待机"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("状态切换成功", function () {
        pm.response.to.have.status(200);
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.primaryStatus).to.eql("IDLE");
        pm.expect(json.data.version).to.eql(2);
        pm.expect(json.data.idempotent).to.eql(false);
      });