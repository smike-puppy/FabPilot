$kind: http-request
name: POST Hold Lot
method: POST
url: 'http://localhost:8080/api/lots/LOT-016/hold'
description: 'Holds LOT-016 before inspection while preserving its READY execution status.'
order: 7000
headers:
  Content-Type: application/json
  X-Trace-Id: 'POSTMAN-FABPILOT-LOT-016-HOLD-FIRST'
body:
  type: json
  content: |-
    {
      "expectedVersion": 2,
      "idempotencyKey": "POSTMAN-LOT-016-HOLD-001",
      "operatorId": "POSTMAN-USER",
      "reasonCode": "QUALITY_CHECK",
      "reasonText": "检测工序前需要复核质量数据"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Lot execution status is preserved and Hold is applied", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.lotCode).to.eql("LOT-016");
        pm.expect(json.data.transactionType).to.eql("HOLD");
        pm.expect(json.data.executionStatus).to.eql("READY");
        pm.expect(json.data.holdStatus).to.eql("HELD");
        pm.expect(json.data.version).to.eql(3);
        pm.expect(json.data.idempotent).to.be.a("boolean");
      });