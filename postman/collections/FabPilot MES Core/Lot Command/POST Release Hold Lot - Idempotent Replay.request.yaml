$kind: http-request
name: POST Release Hold Lot - Idempotent Replay
method: POST
url: '{{app_base_url}}/api/lots/{{lot_release_hold_code}}/release-hold'
description: 'Replay: reuses the same resolution reason and key without appending history.'
order: 10000
headers:
  Content-Type: application/json
  X-Trace-Id: '{{test_trace_prefix}}-LOT-016-RELEASE-HOLD-REPLAY'
body:
  type: json
  content: |-
    {
      "expectedVersion": {{lot_release_hold_expected_version}},
      "idempotencyKey": "{{lot_release_hold_idempotency_key}}",
      "operatorId": "{{test_operator_id}}",
      "reasonCode": "{{lot_release_hold_reason_code}}",
      "reasonText": "{{lot_release_hold_reason_text}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Replay returns the existing Release Hold result", function () {
        const json = pm.response.json();
        pm.expect(json.data.transactionType).to.eql("RELEASE_HOLD");
        pm.expect(json.data.executionStatus).to.eql("READY");
        pm.expect(json.data.holdStatus).to.eql("RELEASED");
        pm.expect(json.data.version).to.eql(4);
        pm.expect(json.data.idempotent).to.eql(true);
      });