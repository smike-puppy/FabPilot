$kind: http-request
name: POST Release Lot
method: POST
url: '{{app_base_url}}/api/lots/{{lot_release_code}}/release'
description: 'Executes LOT-015 Release or safely replays the already completed command with the same idempotency key.'
order: 1000
headers:
  Content-Type: application/json
  X-Trace-Id: '{{test_trace_prefix}}-LOT-015-RELEASE-FIRST'
body:
  type: json
  content: |-
    {
      "expectedVersion": {{lot_release_expected_version}},
      "idempotencyKey": "{{lot_release_idempotency_key}}",
      "operatorId": "{{test_operator_id}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Lot is released to READY", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.lotCode).to.eql("LOT-015");
        pm.expect(json.data.transactionType).to.eql("RELEASE");
        pm.expect(json.data.executionStatus).to.eql("READY");
        pm.expect(json.data.holdStatus).to.eql("RELEASED");
        pm.expect(json.data.version).to.eql(1);
        pm.expect(json.data.idempotent).to.be.a("boolean");
      });

      pm.test("Trace ID is returned", function () {
        const json = pm.response.json();
        pm.expect(json.traceId).to.eql("{{test_trace_prefix}}-LOT-015-RELEASE-FIRST");
        pm.expect(pm.response.headers.get("X-Trace-Id"))
          .to.eql("{{test_trace_prefix}}-LOT-015-RELEASE-FIRST");
      });