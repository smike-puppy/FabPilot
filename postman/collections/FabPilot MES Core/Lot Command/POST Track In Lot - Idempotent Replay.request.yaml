$kind: http-request
name: POST Track In Lot - Idempotent Replay
method: POST
url: 'http://localhost:8080/api/lots/LOT-016/track-in'
description: 'Replay: reuses the Track In idempotency key and must not update either snapshot or append histories.'
order: 4000
headers:
  Content-Type: application/json
  X-Trace-Id: 'POSTMAN-FABPILOT-LOT-016-TRACK-IN-REPLAY'
body:
  type: json
  content: |-
    {
      "expectedVersion": 0,
      "idempotencyKey": "VERIFY-LOT-016-TRACK-IN-001",
      "operatorId": "POSTMAN-USER",
      "equipmentCode": "ETCH-02"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Replay returns the existing result", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.lotCode).to.eql("LOT-016");
        pm.expect(json.data.transactionType).to.eql("TRACK_IN");
        pm.expect(json.data.executionStatus).to.eql("RUNNING");
        pm.expect(json.data.holdStatus).to.eql("RELEASED");
        pm.expect(json.data.version).to.eql(1);
        pm.expect(json.data.idempotent).to.eql(true);
      });