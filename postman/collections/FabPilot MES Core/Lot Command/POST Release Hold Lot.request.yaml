$kind: http-request
name: POST Release Hold Lot
method: POST
url: 'http://localhost:8080/api/lots/LOT-016/release-hold'
description: 'Releases the independent Hold state without changing execution state, step, or equipment.'
order: 9000
headers:
  Content-Type: application/json
  X-Trace-Id: 'POSTMAN-FABPILOT-LOT-016-RELEASE-HOLD-FIRST'
body:
  type: json
  content: |-
    {
      "expectedVersion": 3,
      "idempotencyKey": "POSTMAN-LOT-016-RELEASE-HOLD-001",
      "operatorId": "POSTMAN-USER",
      "reasonCode": "QUALITY_CHECK_RESOLVED",
      "reasonText": "质量数据复核完成，允许继续检测"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Release Hold preserves execution and releases Hold", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.transactionType).to.eql("RELEASE_HOLD");
        pm.expect(json.data.executionStatus).to.eql("READY");
        pm.expect(json.data.holdStatus).to.eql("RELEASED");
        pm.expect(json.data.version).to.eql(4);
        pm.expect(json.data.idempotent).to.eql(false);
      });