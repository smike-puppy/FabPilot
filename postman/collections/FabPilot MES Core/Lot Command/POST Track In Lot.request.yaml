$kind: http-request
name: POST Track In Lot
method: POST
url: '{{app_base_url}}/api/lots/{{lot_track_in_code}}/track-in'
description: 'Tracks LOT-016 into an available, capable ETCH-02 equipment.'
order: 3000
headers:
  Content-Type: application/json
  X-Trace-Id: '{{test_trace_prefix}}-LOT-016-TRACK-IN-FIRST'
body:
  type: json
  content: |-
    {
      "expectedVersion": {{lot_track_in_expected_version}},
      "idempotencyKey": "{{lot_track_in_idempotency_key}}",
      "operatorId": "{{test_operator_id}}",
      "equipmentCode": "{{lot_track_in_equipment_code}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Lot is tracked in to RUNNING", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.lotCode).to.eql("LOT-016");
        pm.expect(json.data.transactionType).to.eql("TRACK_IN");
        pm.expect(json.data.executionStatus).to.eql("RUNNING");
        pm.expect(json.data.holdStatus).to.eql("RELEASED");
        pm.expect(json.data.version).to.eql(1);
        pm.expect(json.data.idempotent).to.be.a("boolean");
      });

      pm.test("Trace ID is returned", function () {
        const json = pm.response.json();
        pm.expect(json.traceId)
          .to.eql("{{test_trace_prefix}}-LOT-016-TRACK-IN-FIRST");
        pm.expect(pm.response.headers.get("X-Trace-Id"))
          .to.eql("{{test_trace_prefix}}-LOT-016-TRACK-IN-FIRST");
      });