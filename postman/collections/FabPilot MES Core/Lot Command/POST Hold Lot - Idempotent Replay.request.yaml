$kind: http-request
name: POST Hold Lot - Idempotent Replay
method: POST
url: 'http://localhost:8080/api/lots/LOT-016/hold'
description: 'Replay: reuses the same Hold reason and idempotency key without appending another transaction.'
order: 8000
headers:
  Content-Type: application/json
  X-Trace-Id: 'POSTMAN-FABPILOT-LOT-016-HOLD-REPLAY'
body:
  type: json
  content: |-
    {
      "expectedVersion": 2,
      "idempotencyKey": "POSTMAN-LOT-016-HOLD-001",
      "operatorId": "POSTMAN-USER",
      "reasonCode": "QUALITY_CHECK",
      "reasonText": "检测工序前需要复核质量数据"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Replay returns the existing Hold result", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.transactionType).to.eql("HOLD");
        pm.expect(json.data.executionStatus).to.eql("READY");
        pm.expect(json.data.holdStatus).to.eql("HELD");
        pm.expect(json.data.version).to.eql(3);
        pm.expect(json.data.idempotent).to.eql(true);
      });