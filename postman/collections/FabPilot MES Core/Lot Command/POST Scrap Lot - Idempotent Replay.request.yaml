$kind: http-request
name: POST Scrap Lot - Idempotent Replay
method: POST
url: '{{app_base_url}}/api/lots/{{lot_scrap_code}}/scrap'
description: 'Scraps LOT-016 as a terminal operation and records the rejection reason.'
order: 12000
headers:
  Content-Type: application/json
  X-Trace-Id: '{{test_trace_prefix}}-LOT-016-SCRAP-REPLAY'
body:
  type: json
  content: |-
    {
      "expectedVersion": {{lot_scrap_expected_version}},
      "idempotencyKey": "{{lot_scrap_idempotency_key}}",
      "operatorId": "{{test_operator_id}}",
      "reasonCode": "{{lot_scrap_reason_code}}",
      "reasonText": "{{lot_scrap_reason_text}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Lot reaches the Scrap terminal state", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.transactionType).to.eql("SCRAP");
        pm.expect(json.data.executionStatus).to.eql("SCRAPPED");
        pm.expect(json.data.holdStatus).to.eql("RELEASED");
        pm.expect(json.data.version).to.eql(5);
        pm.expect(json.data.idempotent).to.eql(true);
      });