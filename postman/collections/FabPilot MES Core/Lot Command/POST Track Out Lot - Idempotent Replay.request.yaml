$kind: http-request
name: POST Track Out Lot - Idempotent Replay
method: POST
url: '{{app_base_url}}/api/lots/{{lot_track_out_code}}/track-out'
description: 'Replay: reuses the Track Out idempotency key and must not change either snapshot or append histories.'
order: 6000
headers:
  Content-Type: application/json
  X-Trace-Id: '{{test_trace_prefix}}-LOT-016-TRACK-OUT-REPLAY'
body:
  type: json
  content: |-
    {
      "expectedVersion": {{lot_track_out_expected_version}},
      "idempotencyKey": "{{lot_track_out_idempotency_key}}",
      "operatorId": "{{test_operator_id}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Replay returns the existing result", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.lotCode).to.eql("LOT-016");
        pm.expect(json.data.transactionType).to.eql("TRACK_OUT");
        pm.expect(json.data.executionStatus).to.eql("READY");
        pm.expect(json.data.holdStatus).to.eql("RELEASED");
        pm.expect(json.data.version).to.eql(2);
        pm.expect(json.data.idempotent).to.eql(true);
      });