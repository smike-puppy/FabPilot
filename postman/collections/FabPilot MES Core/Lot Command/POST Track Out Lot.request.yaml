$kind: http-request
name: POST Track Out Lot
method: POST
url: 'http://localhost:8080/api/lots/LOT-016/track-out'
description: 'Tracks LOT-016 out of ETCH-02 and advances it to the INSPECT step.'
order: 5000
headers:
  Content-Type: application/json
  X-Trace-Id: 'POSTMAN-FABPILOT-LOT-016-TRACK-OUT-FIRST'
body:
  type: json
  content: |-
    {
      "expectedVersion": 1,
      "idempotencyKey": "POSTMAN-LOT-016-TRACK-OUT-001",
      "operatorId": "POSTMAN-USER"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status code is 200", function () {
        pm.response.to.have.status(200);
      });

      pm.test("Lot is tracked out and waits at the next step", function () {
        const json = pm.response.json();
        pm.expect(json.success).to.eql(true);
        pm.expect(json.data.lotCode).to.eql("LOT-016");
        pm.expect(json.data.transactionType).to.eql("TRACK_OUT");
        pm.expect(json.data.executionStatus).to.eql("READY");
        pm.expect(json.data.holdStatus).to.eql("RELEASED");
        pm.expect(json.data.version).to.eql(2);
        pm.expect(json.data.idempotent).to.be.a("boolean");
      });

      pm.test("Trace ID is returned", function () {
        const json = pm.response.json();
        pm.expect(json.traceId)
          .to.eql("POSTMAN-FABPILOT-LOT-016-TRACK-OUT-FIRST");
        pm.expect(pm.response.headers.get("X-Trace-Id"))
          .to.eql("POSTMAN-FABPILOT-LOT-016-TRACK-OUT-FIRST");
      });