$kind: http-request
name: 'HOLD Allow Ready Lot'
method: POST
url: 'http://localhost:8080/api/command-validations'
description: 'LOT-014 为 READY+RELEASED 且当前 Step 有效，Hold 预检查应允许。'
order: 13700
headers:
  Content-Type: application/json
  X-Trace-Id: 'POSTMAN-VALIDATE-HOLD-001'
body:
  type: json
  content: |-
    {
      "commandType": "HOLD",
      "targetType": "LOT",
      "targetCode": "LOT-014",
      "expectedVersion": 2,
      "reasonCode": "QUALITY_CHECK",
      "reasonText": "只读验证暂停规则"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const json = pm.response.json();
      const result = json.data;
      const requiredCheck = result.checks.find(function (check) {
        return check.ruleCode === "LOT_ACTIVE";
      });

      pm.test("Command validation returns a structured result", function () {
        pm.response.to.have.status(200);
        pm.expect(json.success).to.eql(true);
        pm.expect(result.commandType).to.eql("HOLD");
        pm.expect(result.allowed).to.eql(true);
        pm.expect(result.checks).to.be.an("array").that.is.not.empty;
      });

      pm.test("Expected business rule is present", function () {
        pm.expect(requiredCheck).to.be.an("object");
        pm.expect(requiredCheck.evaluated).to.eql(true);
      });