$kind: http-request
name: 06 Close Alarm
method: POST
url: 'http://localhost:8080/api/equipment-alarms/actions'
order: 18000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"alarmId":1,"action":"CLOSE","expectedVersion":1,"idempotencyKey":"POSTMAN-ALARM-CLOSE-001","operatorId":"ENG-001"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Recovered equipment allows close",()=>{pm.response.to.have.status(200);const j=pm.response.json();pm.expect(j.data.status).to.eql("CLOSED");pm.expect(j.data.version).to.eql(2);});