$kind: http-request
name: 02 Acknowledge Idempotent Replay
method: POST
url: 'http://localhost:8080/api/equipment-alarms/actions'
order: 14000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {"alarmId":1,"action":"ACKNOWLEDGE","expectedVersion":0,"idempotencyKey":"POSTMAN-ALARM-ACK-001","operatorId":"ENG-001"}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Replay does not add another action",()=>{pm.response.to.have.status(200);const j=pm.response.json();pm.expect(j.data.version).to.eql(1);pm.expect(j.data.idempotent).to.eql(true);});