services:
  mysql:
    image: mysql:8.4
    container_name: fabpilot-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fabpilot
      MYSQL_USER: fabpilot
      MYSQL_PASSWORD: fabpilot_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot_dev_password"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:

